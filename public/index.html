<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0B6B4F" />
<title>RailX BD — Journey made easy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B6B4F'/%3E%3Cpath d='M5 18L10.5 6M19 18L13.5 6' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M3 20.5h18' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Centralized design tokens: the whole app is built on this single
  // railway-green brand color plus the neutral scale, so every component
  // pulls from the same palette instead of scattering ad-hoc colors.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            DEFAULT: "#0B6B4F",
            hover: "#094F3B",
            dark: "#0A3B2C",
          },
        },
      },
    },
  };
</script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* Same tokens mirrored as CSS variables, for anything outside Tailwind's
     reach and as a single documented source of truth for the palette. */
  :root {
    --color-primary: #0B6B4F;
    --color-primary-hover: #094F3B;
    --color-background: #F4F8F9;
    --color-surface: #FFFFFF;
    --color-text-primary: #171717;
    --color-text-secondary: #6B7280;
    --color-border: #E5E7EB;
    --color-success: #16A34A;
    --color-warning: #D97706;
    --color-error: #DC2626;
    font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; --color-background: #07151E; --color-surface: #0D202B; --color-text-primary: #EDF5F7; --color-text-secondary: #9DB2BC; --color-border: #203844; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--color-background); color: var(--color-text-primary); letter-spacing: .005em; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { font-family: "Manrope", "DM Sans", sans-serif; letter-spacing: -.035em; }
  h1 { font-weight: 800; }
  h2 { font-weight: 700; }
  ::selection { background: rgba(11,107,79,.2); color: #0A3B2C; }
  button, input, select, textarea { font: inherit; }
  button { transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease, color .15s ease; }
  button:not(:disabled):hover { transform: translateY(-1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid rgba(11, 107, 79, .45); outline-offset: 2px; }
  .float-in { animation: floatIn .5s ease both; }
  @keyframes floatIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .station-menu { animation: menuIn .14s ease both; transform-origin: top; }
  @keyframes menuIn { from { opacity: 0; transform: scaleY(.97) translateY(-4px); } to { opacity: 1; transform: scaleY(1) translateY(0); } }
  .station-scroll::-webkit-scrollbar { width: 8px; }
  .station-scroll::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 999px; }
  .home-hero { isolation: isolate; background: linear-gradient(130deg, #123c5a, #0b6b4f 65%, #4d8490); }
  .home-hero::before, .home-hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .home-hero::before { z-index: -2; background: url('/images/railway-hero.png') center 56% / cover no-repeat; opacity: .74; animation: heroImageIn .8s ease both; }
  .home-hero::after { z-index: -1; background: linear-gradient(90deg, rgba(8,31,52,.82) 0%, rgba(10,43,63,.58) 50%, rgba(12,45,56,.24) 100%), linear-gradient(0deg, rgba(8,35,48,.76), transparent 72%); }
  .hero-glass { background: rgba(248, 252, 255, .87); border: 1px solid rgba(255,255,255,.68); box-shadow: 0 24px 70px rgba(7,33,54,.18); backdrop-filter: blur(18px); }
  .glass-nav { background: rgba(8,36,53,.24); border-color: rgba(255,255,255,.18); backdrop-filter: blur(14px); transition: background .3s ease, box-shadow .3s ease, border-color .3s ease; }
  .glass-nav.scrolled { background: rgba(249,252,254,.92); border-color: rgba(210,224,232,.8); box-shadow: 0 8px 28px rgba(20,51,69,.08); }
  .glass-nav.scrolled .home-nav-text { color: #334155; }
  .glass-nav:not(.scrolled) .home-nav-text { color: rgba(255,255,255,.92); }
  .glass-nav:not(.scrolled) .brand-label { color: #fff; }
  .glass-nav:not(.scrolled) .brand-mark { background: rgba(255,255,255,.18); }
  .service-card { transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease; }
  .service-card:hover { transform: translateY(-5px); box-shadow: 0 18px 36px rgba(20,51,69,.1); border-color: rgba(11,107,79,.28); }
  .service-card:hover .service-icon { transform: scale(1.08) rotate(-3deg); }
  .service-icon { transition: transform .24s ease; }
  .role-badge { display: inline-flex; align-items: center; border: 1px solid transparent; font-weight: 700; letter-spacing: .02em; }
  .role-badge-admin { color: #fff; background: #0B6B4F; border-color: #168468; }
  .role-badge-customer { color: #fff; background: #37566a; border-color: #55768a; }
  html[data-theme="dark"] .bg-emerald-50 { background-color: #15372e; }
  html[data-theme="dark"] .text-emerald-700 { color: #82d6b1; }
  html[data-theme="dark"] .border-emerald-200 { border-color: #315c4d; }
  html[data-theme="dark"] .bg-green-50 { background-color: #15372e; }
  html[data-theme="dark"] .text-green-700 { color: #82d6b1; }
  html[data-theme="dark"] .border-green-200 { border-color: #315c4d; }
  html[data-theme="dark"] .bg-amber-50 { background-color: #392d19; }
  html[data-theme="dark"] .text-amber-700 { color: #f0c875; }
  html[data-theme="dark"] .border-amber-200 { border-color: #67512b; }
  html[data-theme="dark"] .bg-red-50 { background-color: #3c2025; }
  html[data-theme="dark"] .text-red-700 { color: #f39aa3; }
  html[data-theme="dark"] .border-red-200 { border-color: #66333b; }
  html[data-theme="dark"] .hero-glass { background: rgba(13,32,43,.91); border-color: rgba(157,178,188,.22); box-shadow: 0 24px 70px rgba(0,0,0,.3); }
  html[data-theme="dark"] .glass-nav.scrolled { background: rgba(9,25,35,.94); border-color: rgba(41,67,79,.9); box-shadow: 0 8px 28px rgba(0,0,0,.2); }
  html[data-theme="dark"] .glass-nav.scrolled .home-nav-text { color: #dce9ed; }
  html[data-theme="dark"] .glass-nav.scrolled .brand-label { color: #edf5f7; }
  html[data-theme="dark"] .glass-nav.scrolled .brand-mark { background-color: #0B6B4F; }
  html[data-theme="dark"] .bg-white { background-color: #0d202b; }
  html[data-theme="dark"] .border-neutral-200 { border-color: #203844; }
  html[data-theme="dark"] .border-neutral-300 { border-color: #29434f; }
  html[data-theme="dark"] .text-neutral-400 { color: #9db2bc; }
  .route-pulse { animation: routePulse 2.2s ease-in-out infinite; }
  .reveal { animation: revealUp .55s ease both; }
  @keyframes heroImageIn { from { opacity: 0; transform: scale(1.025); } to { opacity: .74; transform: scale(1); } }
  @keyframes revealUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes routePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,.22); } 50% { box-shadow: 0 0 0 5px rgba(22,163,74,0); } }
  @media print { header, footer, button { display: none !important; } body { background: white; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module" src="/app.jsx"></script>
</body>
</html>
