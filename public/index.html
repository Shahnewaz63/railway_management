<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0a0a" />
<title>BD Railway — Journey made easy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #fafafa; color: #171717; }
  button, input, select, textarea { font: inherit; }
  button { transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease, border-color .18s ease; }
  button:not(:disabled):hover { transform: translateY(-1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(16, 185, 129, .35); outline-offset: 2px; }
  .float-in { animation: floatIn .65s ease both; }
  @keyframes floatIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .station-menu { animation: menuIn .16s ease both; transform-origin: top; }
  @keyframes menuIn { from { opacity: 0; transform: scaleY(.96) translateY(-4px); } to { opacity: 1; transform: scaleY(1) translateY(0); } }
  .station-scroll::-webkit-scrollbar { width: 8px; }
  .station-scroll::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 999px; }
  .dark .station-scroll::-webkit-scrollbar-thumb { background: #525252; }
  @media print { header, footer, button { display: none !important; } body { background: white; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module" src="/app.jsx"></script>
</body>
</html>
